<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>安全な接続を確認中...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 3px solid #e9ecef;
            border-top: 3px solid #0d6efd;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }
    </style>
    <script>
        // JavaScriptで検証Cookie（1日間有効）をセットして即座にリロード
        var d = new Date();
        d.setTime(d.getTime() + (24 * 60 * 60 * 1000)); // 1日間有効
        document.cookie = "eccube_bot_check=v3rified_hbst_key; expires=" + d.toUTCString() + "; path=/; SameSite=Lax";
        window.location.reload();
    </script>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>安全なアクセスのため、ブラウザを確認しています。<br>画面が自動的に切り替わるまで少々お待ちください...</p>
    </div>
    <noscript>
        <p style="color: #dc3545; font-weight: bold; margin-top: 10px;">
            JavaScriptを有効にしてページを再読み込みしてください。
        </p>
    </noscript>
</body>
</html>
