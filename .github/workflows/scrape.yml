name: Scrape card prices

# NOTE: GitHubにワークフローとして再認識させるための再push
on:
  schedule:
    # 毎日 03:00 JST (UTC 18:00 前日) に実行。頻度は運用しながら調整してよい。
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-card-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python -m scraper.runner

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/shops.json data/card_price.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: update card price data"
            git push
          fi
