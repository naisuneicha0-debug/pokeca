name: Debug fetch shop HTML

on:
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch raw HTML per shop
        run: python -m scraper.debug_fetch

      - name: Upload debug HTML
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug_html/
          retention-days: 7
